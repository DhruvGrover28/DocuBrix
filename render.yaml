services:
  # 1. FastAPI Backend Service (Docker with Tesseract OCR & Neon PostgreSQL)
  - type: web
    name: docubrix-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: APP_ENVIRONMENT
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # 2. React + Vite Frontend (Free Fast Static Site with SPA routing)
  - type: web
    name: docubrix-frontend
    runtime: static
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://docubrix-api.onrender.com
