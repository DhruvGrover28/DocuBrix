services:
  # 1. FastAPI Backend Service (Docker with Tesseract OCR & SQLite)
  - type: web
    name: docubrix-api
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: APP_ENVIRONMENT
        value: production
      - key: AUTH_SECRET
        generateValue: true

  # 2. React + Vite Frontend (Free Fast Static Site with SPA routing)
  - type: web
    name: docubrix-frontend
    runtime: static
    plan: free
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: docubrix-api
          property: host
